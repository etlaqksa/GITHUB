<form name="client-error" method="POST" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="client-error" />
  <input type="text" name="type" />
  <input type="text" name="message" />
  <textarea name="stack"></textarea>
  <input type="text" name="url" />
  <input type="text" name="ua" />
  <input type="text" name="ts" />
</form>
<div id="root"></div>
<script>
(function(){
  try {
    var KEY='etlaq_err_reported_v1';
    function enc(o){return Object.keys(o).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(o[k]);}).join('&');}
    function report(type, info){
      try{
        if (sessionStorage.getItem(KEY)==='1') return;
        sessionStorage.setItem(KEY,'1');
        var msg = (info && (info.message || info.toString && info.toString())) || 'Unknown error';
        var stack = (info && info.stack) ? String(info.stack) : '';
        var payload = {
          'form-name':'client-error',
          type: type,
          message: msg,
          stack: stack,
          url: location.href,
          ua: navigator.userAgent,
          ts: new Date().toISOString()
        };
        fetch('/ar', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: enc(payload)}).catch(function(){});
      }catch(e){}
    }
    window.addEventListener('error', function(e){ report('error', e.error || {message: e.message, stack: (e.filename+':'+e.lineno+':'+e.colno)}); });
    window.addEventListener('unhandledrejection', function(e){ report('unhandledrejection', e.reason || {message: 'Unhandled promise rejection'}); });
  } catch(e) {}
})();
</script>
