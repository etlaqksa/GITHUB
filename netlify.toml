[build]
  publish = "dist"
  command = "npm install && npm run build"

# Ensure Netlify parses static HTML forms (Netlify Forms detection)
[build.processing]
  ignore_html_forms = false

# Language-prefixed SPA routing (matches public/_redirects)
# NOTE: We intentionally do NOT force a trailing slash here to avoid redirect loops
# if Netlify's trailing-slash setting is configured.

[[redirects]]
  from = "/"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/ar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ar/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/gallery/*"
  to = "/gallery/:splat"
  status = 200

[[redirects]]
  from = "/article-images/*"
  to = "/article-images/:splat"
  status = 200

[[redirects]]
  from = "/favicon.png"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "/logo.png"
  to = "/logo.png"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/company-profile.pdf"
  to = "/company-profile.pdf"
  status = 200

[[redirects]]
  from = "/og-image.jpg"
  to = "/og-image.jpg"
  status = 200

[[redirects]]
  from = "/og-image.webp"
  to = "/og-image.webp"
  status = 200

[[redirects]]
  from = "/white-paper-advanced-geophysical-surveys.pdf"
  to = "/white-paper-advanced-geophysical-surveys.pdf"
  status = 200

[[redirects]]
  from = "/white-paper.html"
  to = "/white-paper.html"
  status = 200

[[redirects]]
  from = "/__forms.html"
  to = "/__forms.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# NOTE: We intentionally do NOT add a forced 301 to /ar/* here.
# - For manual deploys, Netlify uses dist/_redirects.
# - For repo-based deploys, we keep behavior consistent with _redirects
#   by rewriting everything to /index.html (SPA) and letting the app
#   canonicalize to /ar or /en via history.replaceState.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# Long cache for local gallery images (used in slideshow + articles fallbacks)
[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Default security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Allow Wikimedia for open-license article images
    # NOTE: We use Google Fonts for bilingual typography. If you prefer stricter CSP,
    # self-host the fonts and remove these sources.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://upload.wikimedia.org https://commons.wikimedia.org; connect-src 'self' https://commons.wikimedia.org; font-src 'self' data: https://fonts.gstatic.com;"
