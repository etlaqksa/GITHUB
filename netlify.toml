[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SITE_URL = "https://etlaqksa.com"

# Ensure Netlify parses static HTML forms (Netlify Forms detection)
[build.processing]
  ignore_html_forms = false

# Language-prefixed SPA routing (matches public/_redirects)
# NOTE: We intentionally do NOT force a trailing slash here to avoid redirect loops
# if Netlify's trailing-slash setting is configured.

[[redirects]]
  from = "/"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/ar/"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/en/"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/ar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ar/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/gallery/*"
  to = "/gallery/:splat"
  status = 200

[[redirects]]
  from = "/article-images/*"
  to = "/article-images/:splat"
  status = 200

[[redirects]]
  from = "/favicon.png"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "/logo.png"
  to = "/logo.png"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
[[redirects]]
  from = "/googleb9eafcb71ddde876.html"
  to = "/googleb9eafcb71ddde876.html"
  status = 200

[[redirects]]
  from = "/og-image.jpg"
  to = "/og-image.jpg"
  status = 200

[[redirects]]
  from = "/og-image.webp"
  to = "/og-image.webp"
  status = 200

[[redirects]]
  from = "/og-share.png"
  to = "/og-share.png"
  status = 200

[[redirects]]
  from = "/og-share.webp"
  to = "/og-share.webp"
  status = 200

[[redirects]]
  from = "/__forms.html"
  to = "/__forms.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# NOTE: We intentionally do NOT add a forced 301 to /ar/* here.
# - For manual deploys, Netlify uses dist/_redirects.
# - For repo-based deploys, we keep behavior consistent with _redirects
#   by rewriting everything to /index.html (SPA) and letting the app
#   canonicalize to /ar or /en via history.replaceState.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long cache for local gallery images (used in slideshow + articles fallbacks)
[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure HTML entrypoints are always revalidated (prevents stale index.html loops)
    Cross-Origin-Resource-Policy = "cross-origin"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"



[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Ensure the Service Worker is always updated promptly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ar"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ar/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ar/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/en"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/en/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/en/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Default security headers
    Cross-Origin-Resource-Policy = "cross-origin"
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # We embed Google Maps on /contact; COEP: require-corp breaks many third-party iframes.
    Cross-Origin-Embedder-Policy = "unsafe-none"
    # Allow the inline GA4 initializer via hash (avoid 'unsafe-inline' for scripts)
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; frame-src 'self' https://www.google.com https://www.google.com/maps https://www.google.com/maps/embed https://maps.google.com https://www.openstreetmap.org; script-src 'self' https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https: https://www.clarity.ms https://c.clarity.ms https://*.clarity.ms; connect-src 'self' https: https://www.clarity.ms https://c.clarity.ms https://*.clarity.ms; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; worker-src 'self'; manifest-src 'self'"

    X-Powered-By = "Etlaq Tech"
