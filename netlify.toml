[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SITE_URL = "https://etlaqksa.com"

# Ensure Netlify parses static HTML forms (Netlify Forms detection)
[build.processing]
  ignore_html_forms = false

# ─── 301 Redirects: Dead pages indexed by Google ────────────────────────────
# These are pages that Google has crawled and indexed but return 404.
# We redirect them to the correct canonical URL to recover crawl budget
# and preserve any link equity.

[[redirects]]
  from = "/home"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/ar/home"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/en/home"
  to = "/en"
  status = 301
  force = true

# Legacy slug patterns that may be indexed
[[redirects]]
  from = "/services/soil-grouting"
  to = "/ar/services/grouting"
  status = 301
  force = true

[[redirects]]
  from = "/services/cavity-detection"
  to = "/ar/services/cavity"
  status = 301
  force = true

[[redirects]]
  from = "/services/geophysical-surveys"
  to = "/ar/services/geophysical"
  status = 301
  force = true

# ─── Language-prefixed SPA routing ──────────────────────────────────────────

[[redirects]]
  from = "/"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/ar/"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/en/"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/ar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ar/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/gallery/*"
  to = "/gallery/:splat"
  status = 200

[[redirects]]
  from = "/article-images/*"
  to = "/article-images/:splat"
  status = 200

[[redirects]]
  from = "/favicon.webp"
  to = "/favicon.webp"
  status = 200

[[redirects]]
  from = "/logo.webp"
  to = "/logo.webp"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
[[redirects]]
  from = "/googleb9eafcb71ddde876.html"
  to = "/googleb9eafcb71ddde876.html"
  status = 200

[[redirects]]
  from = "/og-image.jpg"
  to = "/og-image.jpg"
  status = 200

[[redirects]]
  from = "/og-image.webp"
  to = "/og-image.webp"
  status = 200

[[redirects]]
  from = "/og-share.png"
  to = "/og-share.png"
  status = 200

[[redirects]]
  from = "/og-share.webp"
  to = "/og-share.webp"
  status = 200

[[redirects]]
  from = "/__forms.html"
  to = "/__forms.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# NOTE: We intentionally do NOT add a forced 301 to /ar/* here.
# - For manual deploys, Netlify uses dist/_redirects.
# - For repo-based deploys, we keep behavior consistent with _redirects
#   by rewriting everything to /index.html (SPA) and letting the app
#   canonicalize to /ar or /en via history.replaceState.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# Security: Block .env files from being served
[[redirects]]
  from = "/.env"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404"
  status = 404
  force = true

# ─── High-Performance Caching Headers ───────────────────────────────────────
# Cache built assets (immutable chunked JS and CSS) for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Cache static images and media for 1 year
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"

[[headers]]
  for = "/article-images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"

# Cache fonts for 1 year
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache social icons for 1 year
[[headers]]
  for = "/social-icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache split articles JSON indexes for 1 hour to allow quick edits but maintain speed
[[headers]]
  for = "/article-data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Prevent caching for critical sitemaps, manifests, and index.html to ensure instant updates
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

