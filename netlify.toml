[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SITE_URL = "https://etlaqksa.com"

[build.processing]
  ignore_html_forms = false

# ─── Security Headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://clarity.ms https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://region1.google-analytics.com https://clarity.ms https://www.clarity.ms; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self';"

# ─── Cache Headers ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/article-images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# ─── Redirects ─────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/ar/"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/en/"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/ar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ar/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/gallery/*"
  to = "/gallery/:splat"
  status = 200

[[redirects]]
  from = "/article-images/*"
  to = "/article-images/:splat"
  status = 200

[[redirects]]
  from = "/favicon.webp"
  to = "/favicon.webp"
  status = 200

[[redirects]]
  from = "/logo.webp"
  to = "/logo.webp"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/googleb9eafcb71ddde876.html"
  to = "/googleb9eafcb71ddde876.html"
  status = 200

[[redirects]]
  from = "/og-image.jpg"
  to = "/og-image.jpg"
  status = 200

[[redirects]]
  from = "/og-image.webp"
  to = "/og-image.webp"
  status = 200

[[redirects]]
  from = "/og-share.png"
  to = "/og-share.png"
  status = 200

[[redirects]]
  from = "/og-share.webp"
  to = "/og-share.webp"
  status = 200

[[redirects]]
  from = "/__forms.html"
  to = "/__forms.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
