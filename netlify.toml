[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SITE_URL = "https://etlaqksa.com"

# Ensure Netlify parses static HTML forms (Netlify Forms detection)
[build.processing]
  ignore_html_forms = false

# Language-prefixed SPA routing (matches public/_redirects)
# NOTE: We intentionally do NOT force a trailing slash here to avoid redirect loops
# if Netlify's trailing-slash setting is configured.

[[redirects]]
  from = "/"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/ar/"
  to = "/ar"
  status = 301
  force = true

[[redirects]]
  from = "/en/"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/ar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ar/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/gallery/*"
  to = "/gallery/:splat"
  status = 200

[[redirects]]
  from = "/article-images/*"
  to = "/article-images/:splat"
  status = 200

[[redirects]]
  from = "/favicon.webp"
  to = "/favicon.webp"
  status = 200

[[redirects]]
  from = "/logo.webp"
  to = "/logo.webp"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
[[redirects]]
  from = "/googleb9eafcb71ddde876.html"
  to = "/googleb9eafcb71ddde876.html"
  status = 200

[[redirects]]
  from = "/og-image.jpg"
  to = "/og-image.jpg"
  status = 200

[[redirects]]
  from = "/og-image.webp"
  to = "/og-image.webp"
  status = 200

[[redirects]]
  from = "/og-share.png"
  to = "/og-share.png"
  status = 200

[[redirects]]
  from = "/og-share.webp"
  to = "/og-share.webp"
  status = 200

[[redirects]]
  from = "/__forms.html"
  to = "/__forms.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# NOTE: We intentionally do NOT add a forced 301 to /ar/* here.
# - For manual deploys, Netlify uses dist/_redirects.
# - For repo-based deploys, we keep behavior consistent with _redirects
#   by rewriting everything to /index.html (SPA) and letting the app
#   canonicalize to /ar or /en via history.replaceState.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# Security: Block .env files from being served
[[redirects]]
  from = "/.env"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404"
  status = 404
  force = true
